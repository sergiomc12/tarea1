[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scraper-agent"
version = "0.2.0"
description = "Agente de web scraping profesional con crawler recursivo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx[http2]>=0.27",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "tenacity>=8.2",
    "aiolimiter>=1.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "structlog>=24.0",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
native = [
    # Extensión OPCIONAL de C++ (defense_env/_fim_native) -- ver
    # CHANGELOG.md. Nunca requerida: fim.py cae a Python puro si no está.
    "pybind11>=2.11",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
scraper-agent = "scraper_agent.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
